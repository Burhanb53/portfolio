<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<!-- Source for public/og.png (1200×630). Re-render with: node og/render.mjs -->
<style>
@font-face { font-family: 'SG'; src: url('../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }
@font-face { font-family: 'IS'; font-style: italic; src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); }
@font-face { font-family: 'JB'; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #08080a; }
.og { position: relative; width: 1200px; height: 630px; padding: 56px 64px; color: #f4f4f5; font-family: 'SG', sans-serif; overflow: hidden;
  background:
    radial-gradient(700px 420px at 92% 18%, rgba(157,140,255,.22), transparent 60%),
    radial-gradient(520px 380px at 0% 110%, rgba(157,140,255,.10), transparent 60%),
    #08080a; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse 80% 80% at 70% 40%, #000 30%, transparent 80%); }
.brand { position: relative; display: flex; align-items: center; gap: 14px; font: 600 22px 'JB', monospace; }
.mark { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font: 700 26px 'SG'; color: #0a0a0a; background: linear-gradient(145deg, #fff, #9d8cff); }
.brand span { color: #71717a; }
.badge { position: absolute; top: 60px; right: 64px; display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.04); font: 17px 'JB', monospace; color: #e4e4e7; }
.badge i { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 5px rgba(74,222,128,.18); }
.copy { position: relative; margin-top: 58px; width: 680px; }
h1 { white-space: nowrap; font-size: 68px; line-height: .98; letter-spacing: -.045em; font-weight: 700; }
h1 em { font-family: 'IS', serif; font-weight: 400; letter-spacing: -.01em; color: #9d8cff; }
.role { width: 600px; margin-top: 20px; font-size: 26px; line-height: 1.35; color: #a1a1aa; }
.role b { color: #f4f4f5; font-weight: 600; }
.pills { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
.pills span { padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: #121215; font-size: 18px; font-weight: 500; }
.foot { position: absolute; left: 64px; bottom: 40px; font: 18px 'JB', monospace; color: #71717a; }
.foot b { color: #9d8cff; font-weight: 400; }
/* laptop mockup */
.lap { position: absolute; right: -70px; bottom: 70px; width: 540px; transform: perspective(1400px) rotateY(-14deg) rotateX(4deg); transform-origin: 100% 50%; }
.lid { position: relative; border-radius: 18px 18px 6px 6px; padding: 12px; background: linear-gradient(160deg, #2a2a30, #111114); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 40px 80px -30px rgba(0,0,0,.9), 0 0 120px -30px rgba(157,140,255,.5); }
.scr { border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 10; background: #0c0c0e; }
.bar { height: 22px; background: #17171a; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
.bar i { width: 7px; height: 7px; border-radius: 50%; background: #3f3f46; }
.bar u { margin-left: 12px; height: 11px; width: 180px; border-radius: 6px; background: #26262b; }
.scr img { display: block; width: 100%; height: calc(100% - 22px); object-fit: cover; object-position: top; }
.base { height: 16px; margin: 0 -26px; border-radius: 2px 2px 16px 16px; background: linear-gradient(#d4d4d8, #8b8b93); }
</style>
</head>
<body>
<div class="og">
  <div class="grid"></div>
  <div class="brand"><div class="mark">B</div><p>burhanuddin<span>.dev</span></p></div>
  <div class="badge"><i></i>Available for work · Dubai</div>
  <div class="copy">
    <h1>Burhanuddin Bohra<br><em>builds what you need.</em></h1>
    <p class="role"><b>Software engineer</b> for websites, mobile apps, cloud &amp; AI automation.</p>
    <div class="pills"><span>Websites</span><span>Mobile apps</span><span>Servers &amp; cloud</span><span>Automation</span></div>
  </div>
  <p class="foot">Co-founder of <b>Tripez</b> · 9+ products shipped</p>
  <div class="lap">
    <div class="lid"><div class="scr"><div class="bar"><i></i><i></i><i></i><u></u></div><img src="../public/img/tripez.webp" alt=""></div></div>
    <div class="base"></div>
  </div>
</div>
</body>
</html>
